<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아리의 하루 — 건강 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EDEEE2;
    --paper: #F8F8F0;
    --card: #FFFFFF;
    --ink: #2B2E26;
    --ink-soft: #5C6152;
    --line: #D9DBC8;
    --moss: #4F6F52;
    --moss-dark: #3A5240;
    --brick: #B5432E;
    --brick-soft: #E9D3CB;
    --mustard: #C9932A;
    --mustard-soft: #F2E4C4;
    --plum: #7A6BA6;
    --plum-soft: #E7E1F1;
    --teal: #3E7C82;
    --teal-soft: #DBEAEA;
    --rose: #B2586F;
    --rose-soft: #F2DEE3;
    --shadow: 0 1px 2px rgba(43,46,38,0.06), 0 4px 14px rgba(43,46,38,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans KR', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{ max-width:920px; margin:0 auto; padding:28px 18px 80px; }

  .hero{
    display:flex; align-items:stretch; width:100%; height:158px; border-radius:18px; overflow:hidden;
    margin-bottom:14px; box-shadow:var(--shadow); background:var(--card); border:1px solid var(--line);
  }
  .hero-info{
    flex:0 0 54%; padding:12px 14px 10px; display:flex; flex-direction:column; justify-content:space-between;
    min-width:0;
  }
  .hero-info h1{
    font-family:'Fraunces', serif; font-weight:600; font-optical-sizing:auto;
    font-size:20px; margin:0; color:var(--moss-dark); letter-spacing:-0.01em; line-height:1.15;
  }
  .hero-info .sub{ font-size:11px; color:var(--ink-soft); margin-top:4px; }
  .hero-age{
    align-self:flex-start; display:inline-flex; align-items:center; gap:5px;
    font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:500; color:#fff;
    background:var(--moss); padding:5px 9px; border-radius:7px; line-height:1.3;
  }
  .hero-photo-wrap{ flex:1 1 46%; position:relative; }
  .hero-photo{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 58%;
  }
  @media (min-width:640px){
    .hero{ height:190px; }
    .hero-info h1{ font-size:24px; }
  }

  .share-note{
    font-size:12px; color:var(--ink-soft); background:var(--mustard-soft);
    border:1px solid #E3CE93; border-radius:8px; padding:8px 12px;
    line-height:1.5; margin-bottom:20px;
  }

  .grid{ display:grid; grid-template-columns: 340px 1fr; gap:20px; align-items:start; }
  @media (max-width:760px){ .grid{ grid-template-columns:1fr; } }

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow); padding:18px;
  }

  .calendar-card{ position:relative; overflow:hidden; }
  .calendar-bg-photo{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    object-position:center 20%; opacity:0.16; z-index:0; pointer-events:none;
  }
  .calendar-card-inner{ position:relative; z-index:1; }

  .reminder-title{ justify-content:space-between; }
  .reminder-photo{
    width:46px; height:46px; border-radius:50%; object-fit:cover; flex-shrink:0;
    border:2px solid var(--card); box-shadow:0 0 0 2px var(--teal);
  }

  /* Calendar */
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .cal-head .month{ font-family:'Fraunces', serif; font-size:18px; font-weight:600; }
  .cal-nav{ display:flex; gap:6px; }
  .cal-nav button{
    border:1px solid var(--line); background:var(--paper); border-radius:8px;
    width:30px; height:30px; cursor:pointer; font-size:15px; color:var(--ink);
  }
  .cal-nav button:hover{ background:var(--mustard-soft); }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-dow{ font-size:11px; text-align:center; color:var(--ink-soft); padding-bottom:4px; font-weight:600; }
  .cal-cell{
    position:relative; aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    border-radius:9px; cursor:pointer; font-size:13px; color:var(--ink); font-family:'IBM Plex Mono',monospace;
    border:1px solid transparent;
  }
  .cal-cell.empty{ cursor:default; }
  .cal-cell:not(.empty):hover{ background:var(--paper); }
  .cal-cell.today{ border-color:var(--moss); font-weight:600; }
  .cal-cell.selected{ background:var(--moss); color:#fff; font-weight:600; }
  .cal-dot{ position:absolute; bottom:4px; display:flex; gap:2px; }
  .cal-dot span{ width:4px; height:4px; border-radius:50%; background:var(--moss); }
  .cal-cell.selected .cal-dot span{ background:#fff; }
  .cal-dot span.poop{ background:var(--brick); }
  .cal-cell.selected .cal-dot span.poop{ background:#fff; }
  .cal-dot span.activity{ background:var(--mustard); }
  .cal-cell.selected .cal-dot span.activity{ background:#fff; }
  .cal-dot span.care{ background:var(--plum); }
  .cal-cell.selected .cal-dot span.care{ background:#fff; }
  .cal-dot span.med{ background:var(--teal); }
  .cal-cell.selected .cal-dot span.med{ background:#fff; }
  .cal-dot span.weight{ background:var(--rose); }
  .cal-cell.selected .cal-dot span.weight{ background:#fff; }

  .legend{ display:flex; gap:14px; margin-top:14px; font-size:11.5px; color:var(--ink-soft); flex-wrap:wrap; }
  .legend .sw{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; }

  .activity-row{
    display:flex; align-items:center; gap:10px; padding:9px 12px; border:1px solid var(--line);
    border-radius:10px; margin-bottom:8px; background:var(--paper); font-size:13.5px;
  }
  .activity-badge{
    font-size:11px; font-weight:700; padding:4px 9px; border-radius:7px; white-space:nowrap;
    font-family:'IBM Plex Mono',monospace; background:var(--mustard-soft); color:#8A6D1E;
  }
  .activity-row .duration{ color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; font-size:12px; }
  .activity-row .del{ margin-left:auto; }

  /* Date panel */
  .date-title{ display:flex; align-items:baseline; gap:8px; margin-bottom:16px; }
  .date-title .d{ font-family:'Fraunces', serif; font-size:22px; font-weight:600; }
  .date-title .wd{ font-size:13px; color:var(--ink-soft); }

  .section-label{
    display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600;
    color:var(--moss-dark); text-transform:uppercase; letter-spacing:0.04em; margin:22px 0 10px;
  }
  .section-label:first-child{ margin-top:0; }
  .section-label .ico{ width:16px; height:16px; }

  .meal-card{
    border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; background:var(--paper);
  }
  .meal-card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .meal-label-chip{
    font-family:'IBM Plex Mono',monospace; font-size:12px; background:var(--moss); color:#fff;
    padding:3px 10px; border-radius:20px; font-weight:500;
  }
  .icon-btn{
    border:none; background:transparent; cursor:pointer; color:var(--ink-soft); font-size:13px;
    padding:3px 6px; border-radius:6px;
  }
  .icon-btn:hover{ background:#00000010; color:var(--brick); }

  .food-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:7px 0; border-top:1px dashed var(--line); font-size:13.5px;
  }
  .food-row:first-of-type{ border-top:none; }
  .food-row .desc b{ color:var(--moss-dark); }
  .food-row .desc .amt{ color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; font-size:12.5px; }

  .add-btn{
    display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:500;
    color:var(--moss-dark); background:none; border:1px dashed var(--moss); border-radius:9px;
    padding:7px 12px; cursor:pointer; margin-top:4px;
  }
  .add-btn:hover{ background:#4F6F5212; }
  .add-btn.brick{ color:var(--brick); border-color:var(--brick); }
  .add-btn.brick:hover{ background:#B5432E12; }

  .poop-row{
    display:flex; align-items:center; gap:10px; padding:9px 12px; border:1px solid var(--line);
    border-radius:10px; margin-bottom:8px; background:var(--paper); font-size:13.5px;
  }
  .poop-badge{
    font-size:11px; font-weight:700; padding:4px 9px; border-radius:7px; white-space:nowrap;
    font-family:'IBM Plex Mono',monospace;
  }
  .poop-row .time{ color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; font-size:12px; min-width:44px; }
  .poop-row .note{ flex:1; color:var(--ink-soft); }
  .poop-row .del{ margin-left:auto; }
  .poop-thumb{
    width:32px; height:32px; border-radius:8px; object-fit:cover; cursor:pointer;
    border:1px solid var(--line); flex-shrink:0;
  }
  #lightboxOverlay{ background:rgba(20,20,16,0.86); cursor:zoom-out; }
  #lightboxOverlay img{ max-width:92vw; max-height:85vh; border-radius:10px; box-shadow:0 10px 40px rgba(0,0,0,0.4); }
  .photo-preview{
    margin-top:8px; max-width:100%; max-height:180px; border-radius:10px; border:1px solid var(--line);
    display:block; object-fit:cover;
  }
  .photo-picker-btn{
    display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:500;
    color:var(--ink-soft); background:var(--paper); border:1px solid var(--line); border-radius:9px;
    padding:9px 12px; cursor:pointer;
  }
  .photo-picker-btn:hover{ background:#00000008; }
  .photo-remove{ font-size:12px; color:var(--brick); background:none; border:none; cursor:pointer; margin-top:6px; }

  .reminder-card{ margin-bottom:20px; }
  .reminder-title{
    font-family:'Fraunces', serif; font-size:17px; font-weight:600; margin:0 0 4px;
    display:flex; align-items:center; gap:7px;
  }
  .reminder-sub{ font-size:12px; color:var(--ink-soft); margin-bottom:14px; }
  .reminder-list{ display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:8px; }
  .reminder-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:13px; background:var(--paper);
  }
  .reminder-row.overdue{ background:var(--brick-soft); border-color:#D9B3A8; }
  .reminder-row.overdue .reminder-text{ color:var(--brick); font-weight:600; }
  .reminder-alert{ font-size:14px; flex-shrink:0; }

  .ask-card{ margin-bottom:20px; }
  .ask-title-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:4px; flex-wrap:wrap; }
  .ask-hero{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .ask-photo{
    width:56px; height:56px; border-radius:12px; object-fit:cover; flex-shrink:0;
    box-shadow:var(--shadow); border:2px solid var(--card);
  }
  .ask-bubble{
    position:relative; background:var(--paper); border:1.5px solid var(--moss);
    border-radius:12px 12px 12px 3px; padding:6px 12px;
    font-family:'Gaegu', cursive; font-weight:700; font-size:15px; color:var(--moss-dark); white-space:nowrap;
  }
  .ask-chips{ display:flex; flex-wrap:wrap; gap:7px; margin:12px 0 4px; }
  .ask-chip{
    font-size:12px; background:var(--paper); border:1px solid var(--line); border-radius:20px;
    padding:7px 12px; cursor:pointer; color:var(--ink-soft);
  }
  .ask-chip:hover{ background:var(--mustard-soft); border-color:#E3CE93; color:var(--ink); }
  .ask-input-row{ display:flex; gap:8px; margin-top:10px; }
  .ask-input-row input{
    flex:1; border:1px solid var(--line); border-radius:10px; padding:10px 12px;
    font-size:14px; font-family:inherit; background:var(--paper); color:var(--ink);
  }
  .ask-input-row input:focus{ outline:2px solid var(--moss); outline-offset:1px; }
  .ask-input-row button{
    border:none; background:var(--moss); color:#fff; border-radius:10px; padding:0 16px;
    font-size:14px; font-weight:600; cursor:pointer; flex-shrink:0;
  }
  .ask-input-row button:hover{ background:var(--moss-dark); }
  #askAnswer{
    margin-top:12px; font-size:13.5px; line-height:1.7; white-space:pre-line;
    background:var(--paper); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; display:none;
  }
  #askAnswer.show{ display:block; }
  #askAnswer.error{ color:var(--brick); background:var(--brick-soft); border-color:#D9B3A8; }

  .empty-note{ font-size:13px; color:var(--ink-soft); font-style:italic; padding:6px 0 2px; }

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(43,46,38,0.45); display:none;
    align-items:flex-end; justify-content:center; z-index:50;
  }
  .overlay.open{ display:flex; }
  @media (min-width:640px){ .overlay{ align-items:center; } }
  .modal{
    background:var(--card); width:100%; max-width:440px; border-radius:18px 18px 0 0;
    max-height:88vh; overflow-y:auto; padding:20px 20px 26px; box-shadow:0 -4px 30px rgba(0,0,0,0.2);
  }
  @media (min-width:640px){ .modal{ border-radius:18px; } }
  .modal h3{ font-family:'Fraunces',serif; font-size:19px; margin:0 0 16px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:7px; }
  .chip{
    border:1px solid var(--line); background:var(--paper); border-radius:9px; padding:7px 12px;
    font-size:13px; cursor:pointer; color:var(--ink);
  }
  .chip.active{ background:var(--moss); border-color:var(--moss); color:#fff; font-weight:600; }
  .chip.brick.active{ background:var(--brick); border-color:var(--brick); }
  input[type=text], input[type=number], input[type=time], select{
    width:100%; border:1px solid var(--line); border-radius:9px; padding:9px 11px; font-size:14px;
    font-family:inherit; background:var(--paper); color:var(--ink);
  }
  input:focus, select:focus{ outline:2px solid var(--moss); outline-offset:1px; }
  .btn-row{ display:flex; gap:8px; margin-top:18px; }
  .btn{
    flex:1; border:none; border-radius:10px; padding:11px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .btn.primary{ background:var(--moss); color:#fff; }
  .btn.primary:hover{ background:var(--moss-dark); }
  .btn.ghost{ background:var(--paper); color:var(--ink-soft); border:1px solid var(--line); }
  .btn.danger{ background:var(--brick); color:#fff; }

  .loading{ text-align:center; padding:60px 0; color:var(--ink-soft); font-size:14px; }
  .save-toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--moss-dark); color:#fff; padding:9px 18px; border-radius:20px; font-size:13px;
    opacity:0; transition:all 0.25s; pointer-events:none; z-index:100;
  }
  .save-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>

function fmtDate(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ---------- storage helpers (jsonblob.com — no login needed) ---------- */
function emptyDay(){ return {meals:[], poops:[], activities:[], care:[], meds:[], weights:[]}; }

async function loadAppData(){
  if(!BLOB_ID){
    // 최초 실행: 새 저장소를 자동 생성
    try{
      const res = await fetch(JSONBLOB_BASE, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({days:{}})
      });
      const loc = res.headers.get('Location') || res.headers.get('location') || '';
      BLOB_ID = loc.split('/').pop();
      APP_DATA = { days:{} };
      showSetupBanner(BLOB_ID);
    }catch(e){
      console.error('blob create failed', e);
      APP_DATA = { days:{} };
    }
    return;
  }
  try{
    const res = await fetch(`${JSONBLOB_BASE}/${BLOB_ID}`);
    if(res.ok){
      APP_DATA = await res.json();
      if(!APP_DATA.days) APP_DATA.days = {};
    } else {
      APP_DATA = { days:{} };
    }
  }catch(e){
    console.error('blob load failed', e);
    APP_DATA = { days:{} };
  }
}

function showSetupBanner(id){
  const warn = document.createElement('div');
  warn.style.cssText = 'background:var(--mustard);color:#3A2C05;padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;line-height:1.6;';
  warn.innerHTML = `⚙️ <b>최초 설정이 필요해요.</b> 아래 코드를 복사해서 알려주시면, 모두가 같은 기록을 보도록 고정해드릴게요.<br><span style="font-family:'IBM Plex Mono',monospace; user-select:all; background:#fff; padding:2px 6px; border-radius:4px; display:inline-block; margin-top:4px;">${id}</span>`;
  document.querySelector('.wrap').insertBefore(warn, document.getElementById('reminderCard'));
}

async function persistAppData(){
  try{
    await fetch(`${JSONBLOB_BASE}/${BLOB_ID}`, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(APP_DATA)
    });
    return true;
  }catch(e){
    console.error('save failed', e);
    return false;
  }
}

async function loadDay(dateStr){
  if(!APP_DATA.days[dateStr]) APP_DATA.days[dateStr] = emptyDay();
  const d = APP_DATA.days[dateStr];
  if(!d.activities) d.activities = [];
  if(!d.care) d.care = [];
  if(!d.meds) d.meds = [];
  if(!d.weights) d.weights = [];
  return d;
}

async function saveDay(dateStr, data){
  const has = (data.meals && data.meals.length) || (data.poops && data.poops.length) || (data.activities && data.activities.length) || (data.care && data.care.length) || (data.meds && data.meds.length) || (data.weights && data.weights.length);
  if(has){ APP_DATA.days[dateStr] = data; dateIndex.add(dateStr); }
  else { delete APP_DATA.days[dateStr]; dateIndex.delete(dateStr); }
  dotCache[dateStr] = {
    meal: !!(data.meals && data.meals.length),
    poop: !!(data.poops && data.poops.length),
    activity: !!(data.activities && data.activities.length),
    care: !!(data.care && data.care.length),
    med: !!(data.meds && data.meds.length),
    weight: !!(data.weights && data.weights.length)
  };
  const ok = await persistAppData();
  if(ok){
    showToast();
    renderReminderCard();
  } else {
    showToast('저장 실패! 인터넷 연결을 확인해주세요.', true);
  }
}

/* ---------- reminders ---------- */
async function computeReminders(){
  const sortedDates = [...dateIndex].sort().reverse(); // most recent first
  const found = {};
  const remaining = new Set(REMINDER_CONFIG.map(r=>r.key));
  for(const dStr of sortedDates){
    if(remaining.size === 0) break;
    const data = await loadDay(dStr);
    for(const cfg of REMINDER_CONFIG){
      if(!remaining.has(cfg.key)) continue;
      if(cfg.check(data)){
        found[cfg.key] = dStr;
        remaining.delete(cfg.key);
      }
    }
  }
  const today0 = new Date();
  today0.setHours(0,0,0,0);
  return REMINDER_CONFIG.map(cfg=>{
    const lastDate = found[cfg.key] || null;
    let daysSince = null;
    if(lastDate){
      const [y,m,d] = lastDate.split('-').map(Number);
      const last = new Date(y, m-1, d);
      daysSince = Math.round((today0 - last) / 86400000);
    }
    const overdue = daysSince === null || daysSince > cfg.days;
    return { ...cfg, lastDate, daysSince, overdue };
  });
}

async function renderReminderCard(){
  const card = document.getElementById('reminderCard');
  if(!card) return;
  const results = await computeReminders();
  card.innerHTML = `
    <div class="reminder-title">
      <span>🔔 리마인더</span>
      <img class="reminder-photo" src="${REMINDER_PHOTO}" alt="아리">
    </div>
    <div class="reminder-sub">마지막으로 한 지 목표 기간이 지나면 알람이 표시돼요.</div>
    <div class="reminder-list">
      ${results.map(r => `
        <div class="reminder-row ${r.overdue ? 'overdue' : ''}">
          <span class="reminder-text">${r.lastDate ? `${r.label}한 지 ${r.daysSince}일` : `${r.label} 기록 없음`}</span>
          ${r.overdue ? '<span class="reminder-alert" title="목표 기간 초과">🔔</span>' : ''}
        </div>
      `).join('')}
    </div>
  `;
}

function showToast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg || '저장됐어요';
  t.style.background = isError ? 'var(--brick)' : 'var(--moss-dark)';
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), isError ? 4000 : 1400);
}

/* ---------- render root ---------- */
async function render(){
  const app = document.getElementById('app');
  app.innerHTML = calendarHTML() + `<div class="card" id="dateCard"></div>`;
  attachCalendarEvents();
  await renderDatePanel();
}

function calendarHTML(){
  const monthNames = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const first = new Date(viewYear, viewMonth, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const todayStr = fmtDate(new Date());

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateObj = new Date(viewYear, viewMonth, d);
    const dStr = fmtDate(dateObj);
    const isToday = dStr === todayStr;
    const isSel = dStr === selectedDate;
    const dc = dotCache[dStr];
    let dots = '';
    if(dc && (dc.meal || dc.poop || dc.activity || dc.care || dc.med || dc.weight)){
      dots = `<div class="cal-dot">${dc.meal?'<span></span>':''}${dc.poop?'<span class="poop"></span>':''}${dc.activity?'<span class="activity"></span>':''}${dc.care?'<span class="care"></span>':''}${dc.med?'<span class="med"></span>':''}${dc.weight?'<span class="weight"></span>':''}</div>`;
    } else if(dateIndex.has(dStr)){
      dots = `<div class="cal-dot"><span></span></div>`;
    }
    cells += `<div class="cal-cell ${isToday?'today':''} ${isSel?'selected':''}" data-date="${dStr}">${d}${dots}</div>`;
  }

  return `
  <div class="card calendar-card">
    <img class="calendar-bg-photo" src="${CALENDAR_BG_PHOTO}" alt="">
    <div class="calendar-card-inner">
      <div class="cal-head">
        <div class="month">${viewYear}년 ${monthNames[viewMonth]}</div>
        <div class="cal-nav">
          <button id="prevMonth">‹</button>
          <button id="nextMonth">›</button>
        </div>
      </div>
      <div class="cal-grid">
        ${['일','월','화','수','목','금','토'].map(w=>`<div class="cal-dow">${w}</div>`).join('')}
        ${cells}
      </div>
      <div class="legend">
        <span><span class="sw" style="background:var(--moss)"></span>식사 기록</span>
        <span><span class="sw" style="background:var(--brick)"></span>배변 기록</span>
        <span><span class="sw" style="background:var(--mustard)"></span>활동 기록</span>
        <span><span class="sw" style="background:var(--plum)"></span>케어 기록</span>
        <span><span class="sw" style="background:var(--teal)"></span>약 기록</span>
        <span><span class="sw" style="background:var(--rose)"></span>체중 기록</span>
      </div>
    </div>
  </div>`;
}

function attachCalendarEvents(){
  document.getElementById('prevMonth').onclick = ()=>{
    viewMonth--; if(viewMonth<0){viewMonth=11; viewYear--;}
    render();
  };
  document.getElementById('nextMonth').onclick = ()=>{
    viewMonth++; if(viewMonth>11){viewMonth=0; viewYear++;}
    render();
  };
  document.querySelectorAll('.cal-cell[data-date]').forEach(el=>{
    el.onclick = ()=>{ selectedDate = el.dataset.date; render(); };
  });
}

/* ---------- date panel ---------- */
async function renderDatePanel(){
  const card = document.getElementById('dateCard');
  card.innerHTML = `<div class="loading">불러오는 중...</div>`;
  const data = await loadDay(selectedDate);
  dotCache[selectedDate] = {

function openLightbox(src){
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightboxOverlay').classList.add('open');
}

  document.getElementById('lightboxOverlay').classList.remove('open');

function updateCalendarDots(){
  document.querySelectorAll('.cal-cell[data-date]').forEach(el=>{
    const dStr = el.dataset.date;
    const dc = dotCache[dStr];
    const existing = el.querySelector('.cal-dot');
    if(existing) existing.remove();
    if(dc && (dc.meal || dc.poop || dc.activity || dc.care || dc.med || dc.weight)){
      const div = document.createElement('div');
      div.className = 'cal-dot';
      div.innerHTML = `${dc.meal?'<span></span>':''}${dc.poop?'<span class="poop"></span>':''}${dc.activity?'<span class="activity"></span>':''}${dc.care?'<span class="care"></span>':''}${dc.med?'<span class="med"></span>':''}${dc.weight?'<span class="weight"></span>':''}`;
      el.appendChild(div);
    }
  });
}

function foodTitle(f){
  if(f.category === 'Pet Cubes') return `Pet Cubes · ${f.flavor}`;
  if(f.category === 'Grateful Pets') return `Grateful Pets · ${f.flavor}`;
  if(f.category === 'Ziwi Peak') return `Ziwi Peak · ${f.flavor}`;
  if(f.category === '삶은 닭고기') return `삶은 닭고기`;
  if(f.category === '쌀밥') return `쌀밥`;
  if(f.category === '기타') return f.customText || '기타 음식';
  return f.category;
}
function foodAmount(f){
  if(f.category === 'Pet Cubes' || f.category === 'Grateful Pets') return f.amount;
  if(f.category === 'Ziwi Peak' || f.category === '삶은 닭고기' || f.category === '쌀밥') return `${f.grams}g`;
  return f.amount || '';
}

function readAndCompressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 800;
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = ()=> reject(new Error('이미지를 불러올 수 없어요.'));
      img.src = e.target.result;
    };
    reader.onerror = ()=> reject(new Error('파일을 읽을 수 없어요.'));
    reader.readAsDataURL(file);
  });
}

function renderAriAge(){
  const el = document.getElementById('ariAge');
  if(!el) return;
  const birth = new Date(2025, 3, 10); // 2025년 4월 10일
  const today = new Date();
  let years = today.getFullYear() - birth.getFullYear();
  let months = today.getMonth() - birth.getMonth();
  let days = today.getDate() - birth.getDate();
  if(days < 0){
    months--;
    const prevMonthLastDay = new Date(today.getFullYear(), today.getMonth(), 0).getDate();
    days += prevMonthLastDay;
  }
  if(months < 0){
    years--;
    months += 12;
  }
  el.textContent = `🎂 태어난 지 ${years}년 ${months}개월 ${days}일`;
}

/* ---------- ask (기록 검색) ---------- */
function dateRangeArray(start, end){
  const arr = [];
  let d = new Date(start);
  while(d <= end){
    arr.push(fmtDate(d));
    d.setDate(d.getDate()+1);
  }
  return arr;
}

function extractDateRange(q){
  const today = new Date(); today.setHours(0,0,0,0);
  let m;
  if(m = q.match(/(\d{4})년\s*(\d{1,2})월/)){
    const y = parseInt(m[1]), mo = parseInt(m[2]);
    return { start: new Date(y, mo-1, 1), end: new Date(y, mo, 0), label: `${y}년 ${mo}월` };
  }
  if(m = q.match(/(지난|최근)\s*(\d+)\s*(일|주|개월|달)/)){
    const n = parseInt(m[2]); const unit = m[3];
    const days = unit === '일' ? n : unit === '주' ? n*7 : n*30;
    const end = new Date(today);
    const start = new Date(today); start.setDate(start.getDate() - (days - 1));
    return { start, end, label: `최근 ${n}${unit}` };
  }
  if(q.includes('오늘')) return { start: today, end: today, label: '오늘' };
  if(q.includes('어제')){
    const y = new Date(today); y.setDate(y.getDate()-1);
    return { start: y, end: y, label: '어제' };
  }
  if(q.includes('지난주') || q.includes('지난 주')){
    const dow = today.getDay();
    const thisWeekStart = new Date(today); thisWeekStart.setDate(thisWeekStart.getDate()-dow);
    const start = new Date(thisWeekStart); start.setDate(start.getDate()-7);
    const end = new Date(thisWeekStart); end.setDate(end.getDate()-1);
    return { start, end, label: '지난 주' };
  }
  if(q.includes('이번주') || q.includes('이번 주')){
    const dow = today.getDay();
    const start = new Date(today); start.setDate(start.getDate()-dow);
    return { start, end: today, label: '이번 주' };
  }
  if(q.includes('지난달') || q.includes('지난 달')){
    const start = new Date(today.getFullYear(), today.getMonth()-1, 1);
    const end = new Date(today.getFullYear(), today.getMonth(), 0);
    return { start, end, label: '지난 달' };
  }
  if(q.includes('이번달') || q.includes('이번 달')){
    return { start: new Date(today.getFullYear(), today.getMonth(), 1), end: today, label: '이번 달' };
  }
  return null;
}

const CATEGORY_KEYWORDS = [
  {kw:'유치원', domain:'activity', type:'유치원', label:'유치원'},
  {kw:'산책', domain:'activity', type:'산책', label:'산책'},
  {kw:'수영', domain:'activity', type:'수영', label:'수영'},
  {kw:'목욕', domain:'care', type:'목욕', label:'목욕'},
  {kw:'귀청소', domain:'care', type:'귀청소', label:'귀청소'},
  {kw:'빗질', domain:'care', type:'빗질', label:'빗질'},
  {kw:'양치', domain:'care', type:'양치', label:'양치'},
  {kw:'넥스가드', domain:'med', type:'Nexgard', label:'Nexgard'},
  {kw:'Nexgard', domain:'med', type:'Nexgard', label:'Nexgard'},
  {kw:'유산균', domain:'med', type:'유산균', label:'유산균'},
  {kw:'몸무게', domain:'weight', type:null, label:'체중'},
  {kw:'체중', domain:'weight', type:null, label:'체중'},
  {kw:'배변', domain:'poop', type:null, label:'배변'},
  {kw:'대변', domain:'poop', type:null, label:'배변'},
  {kw:'응가', domain:'poop', type:null, label:'배변'},
  {kw:'고기', domain:'meal', type:null, label:'식사'},
  {kw:'식사', domain:'meal', type:null, label:'식사'},
  {kw:'끼니', domain:'meal', type:null, label:'식사'},
  {kw:'밥', domain:'meal', type:null, label:'식사'},
  {kw:'약', domain:'med', type:null, label:'약'},
  {kw:'케어', domain:'care', type:null, label:'케어'},
  {kw:'활동', domain:'activity', type:null, label:'활동'},
];

function detectCategory(q){
  for(const c of CATEGORY_KEYWORDS){ if(q.includes(c.kw)) return c; }
  return null;
}

function detectIntent(q){
  if(/몇\s*번|횟수|몇\s*회/.test(q)) return 'count';
  if(/추이|변화|그래프/.test(q)) return 'trend';
  if(/주로|가장\s*많이|어떤/.test(q)) return 'mode';
  return 'summary';
}

const POOP_COND_LABELS = {A:'딱딱한 변', B:'살짝 소프트', C:'설사', D:'심한 설사/긴급'};

function answerQuestion(q){
  const range = extractDateRange(q);
  if(!range){
    return { ok:false, text:'기간을 못 찾았어요. "이번 달", "지난 2주", "2027년 6월"처럼 기간을 넣어서 다시 물어봐주세요.' };
  }
  const cat = detectCategory(q);
  if(!cat){
    return { ok:false, text:'무엇에 대한 질문인지 못 찾았어요. 유치원·산책·수영·목욕·귀청소·빗질·양치·체중·식사·배변·약 중에서 물어봐주세요.' };
  }
  const intent = detectIntent(q);
  const dates = dateRangeArray(range.start, range.end);

  if(cat.domain === 'activity' || cat.domain === 'care' || cat.domain === 'med'){
    const listKey = cat.domain === 'activity' ? 'activities' : cat.domain === 'care' ? 'care' : 'meds';
    let count = 0;
    const perDate = [];
    for(const dStr of dates){
      const day = APP_DATA.days[dStr];
      if(!day) continue;
      const matches = (day[listKey] || []).filter(item => {
        if(cat.domain === 'med') return !cat.type || item.name === cat.type;
        return !cat.type || item.type === cat.type;
      });
      if(matches.length){ perDate.push(`${dStr.slice(5)} (${matches.length}회)`); count += matches.length; }
    }
    if(count === 0) return { ok:true, text:`${range.label} 동안 ${cat.label} 기록이 없어요.` };
    if(intent === 'count') return { ok:true, text:`${range.label} 동안 ${cat.label}을(를) 총 ${count}번 했어요.` };
    return { ok:true, text:`${range.label} 동안 ${cat.label}은(는) 총 ${count}번 기록됐어요.\n(${perDate.join(', ')})` };
  }

  if(cat.domain === 'weight'){
    const entries = [];
    for(const dStr of dates){
      const day = APP_DATA.days[dStr];
      if(day && day.weights) day.weights.forEach(w => entries.push({date:dStr, kg:parseFloat(w.kg)}));
    }
    if(entries.length === 0) return { ok:true, text:`${range.label} 동안 체중 기록이 없어요.` };
    entries.sort((a,b)=> a.date.localeCompare(b.date));
    const first = entries[0], last = entries[entries.length-1];
    const delta = (last.kg - first.kg).toFixed(2);
    const sign = delta > 0 ? '+' : '';
    const list = entries.map(e => `${e.date.slice(5)}: ${e.kg}kg`).join('\n');
    const trendLine = entries.length > 1 ? `\n\n${first.date.slice(5)} ${first.kg}kg → ${last.date.slice(5)} ${last.kg}kg (${sign}${delta}kg)` : '';
    return { ok:true, text:`${range.label} 체중 기록이에요.\n${list}${trendLine}` };
  }

  if(cat.domain === 'meal'){
    const flavorCount = {};
    for(const dStr of dates){
      const day = APP_DATA.days[dStr];
      if(!day || !day.meals) continue;
      day.meals.forEach(meal => (meal.foods || []).forEach(f => {
        let flavor = null;
        if(f.category === 'Pet Cubes' || f.category === 'Grateful Pets' || f.category === 'Ziwi Peak') flavor = f.flavor;
        else if(f.category === '삶은 닭고기') flavor = 'Chicken';
        if(flavor) flavorCount[flavor] = (flavorCount[flavor] || 0) + 1;
      }));
    }
    const keys = Object.keys(flavorCount);
    if(keys.length === 0) return { ok:true, text:`${range.label} 동안 고기 종류가 기록된 식사가 없어요.` };
    keys.sort((a,b) => flavorCount[b] - flavorCount[a]);
    const top = keys[0];
    const breakdown = keys.map(k => `${k} ${flavorCount[k]}회`).join(', ');
    return { ok:true, text:`${range.label} 동안 주로 ${top}를 먹었어요 (${flavorCount[top]}회).\n전체: ${breakdown}` };
  }

  if(cat.domain === 'poop'){
    let count = 0;
    const condCount = {};
    for(const dStr of dates){
      const day = APP_DATA.days[dStr];
      if(!day || !day.poops) continue;
      day.poops.forEach(p => { count++; condCount[p.cond] = (condCount[p.cond]||0)+1; });
    }
    if(count === 0) return { ok:true, text:`${range.label} 동안 배변 기록이 없어요.` };
    const breakdown = Object.keys(condCount).map(k => `${POOP_COND_LABELS[k]||k} ${condCount[k]}회`).join(', ');
    return { ok:true, text:`${range.label} 동안 배변은 총 ${count}번 기록됐어요.\n${breakdown}` };
  }

  return { ok:false, text:'아직 이 질문은 이해하지 못했어요.' };
}

function runAsk(){
  const input = document.getElementById('askInput');
  const q = input.value.trim();
  const box = document.getElementById('askAnswer');
  if(!q){ return; }
  const result = answerQuestion(q);
  box.textContent = result.text;
  box.className = result.ok ? 'show' : 'show error';
}

  renderAriAge();

  for(const dStr of dateIndex){
    const data = APP_DATA.days[dStr];

      document.getElementById('askInput').value = chip.textContent;

    };
  });
})();
